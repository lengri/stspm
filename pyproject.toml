[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stspm"]

[project]
name = "stspm"
version = "0.0.1"
authors = [
  { name = "Lennart Grimm" }
]
description = "A tool for analysing Stochastic Threshold Stream Power Models"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
  "numpy",
  "scipy"
]